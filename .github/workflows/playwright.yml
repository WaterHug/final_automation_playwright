name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20 # Use a recent LTS Node.js version
    
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    
    # Ensure report directories exist for artifact uploads, even if tests fail to create them
    - name: Create empty report directories if not exist
      if: always() # Run this even if tests failed
      run: |
        mkdir -p allure-results # Allure input directory
        mkdir -p allure-report # Allure output directory
        mkdir -p playwright-report # Playwright HTML report directory
        mkdir -p test-results # Playwright test results directory

    - name: Generate Allure Report
      if: always() # Always run this step, even if tests fail
      run: npx allure-commandline generate allure-results --clean -o allure-report
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        retention-days: 5 # Keep report for 5 days
    - name: Upload Playwright Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results
        path: test-results
        retention-days: 5 # Keep results for 5 days
    - name: Upload Playwright HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: playwright-report
        retention-days: 5 # Keep report for 5 days
